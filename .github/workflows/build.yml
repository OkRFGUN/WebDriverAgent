name: build-wda

# Compile WebDriverAgent on a GitHub macOS runner and produce a sideloadable ipa.
# Windows has no Xcode; this is the only clean way to get WDA without a Mac.
#
# NOTE: keep this file ASCII-only. PowerShell (GBK) mangles UTF-8 CJK when it
# reads and re-uploads the file, which silently breaks the YAML structure.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDK versions
        run: |
          echo "=== Xcode ==="
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -i ios || true
          echo "=== simulator runtimes ==="
          xcrun simctl list runtimes 2>/dev/null | head -20 || true

      - name: Build WebDriverAgentRunner without signing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./out \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -40

      - name: Package ipa
        run: |
          set -e
          APP=$(find ./out/Build/Products -name "WebDriverAgentRunner-Runner.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::WebDriverAgentRunner-Runner.app not found, check the build log above"
            find ./out/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgentRunner.ipa Payload
          ls -lh WebDriverAgentRunner.ipa
          find ./out/Build/Products -name "*.xctestrun" -exec cp {} . \;
          ls -lh *.xctestrun || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA
          path: |
            WebDriverAgentRunner.ipa
            *.xctestrun
          if-no-files-found: error
